<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Modo claro">
    <span class="theme-toggle-track"></span>
    <span id="theme-toggle-text">Modo claro</span>
  </button>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">MODO</span>
          <div class="mode-list">
            <button class="mode-btn active" data-mode="classic" aria-pressed="true">Clásico</button>
            <button class="mode-btn" data-mode="sprint" aria-pressed="false">Sprint 40</button>
            <button class="mode-btn" data-mode="survival" aria-pressed="false">Basura</button>
            <button class="mode-btn" data-mode="fixed" aria-pressed="false">Bloques fijos</button>
            <button class="mode-btn" data-mode="invisible" aria-pressed="false">Invisibles</button>
            <button class="mode-btn" data-mode="reverse" aria-pressed="false">Rotación inversa</button>
          </div>
        </div>

        <div id="objective-section" class="panel-section" hidden>
          <span class="label">OBJETIVO</span>
          <p id="objective-desc" class="objective-desc"></p>
          <span id="objective-progress" class="objective-progress"></span>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div id="energy" class="energy" role="progressbar" aria-label="Energía" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="energy-fill"></div>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li data-skill="peek"><kbd>1</kbd> ver 5 siguientes <span class="cost">20</span></li>
            <li data-skill="swap"><kbd>2</kbd> cambiar pieza <span class="cost">30</span></li>
            <li data-skill="slow"><kbd>3</kbd> ralentizar <span class="cost">40</span></li>
            <li data-skill="undo"><kbd>4</kbd> deshacer <span class="cost">50</span></li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-box" class="records-box"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <div id="start-screen" class="start-screen">
    <div class="start-box">
      <h2 class="start-title">TETRIS</h2>
      <div id="start-records" class="records-box"></div>
      <button id="play-btn" class="primary-btn">Jugar</button>
      <div class="clear-row">
        <button id="clear-records-btn" class="link-btn">Borrar records</button>
        <span id="clear-confirm" class="clear-confirm" hidden>
          ¿Seguro?
          <button id="clear-yes" class="link-btn">Sí</button>
          <button id="clear-no" class="link-btn">No</button>
        </span>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
